spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/orders
    username: shop
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081
