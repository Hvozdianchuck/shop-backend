spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/orders
    username: shop
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.shop.orderservice.infrastructure.StockEvent
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 2s

server:
  port: 8081

catalog:
  base-url: http://localhost:8082

resilience4j:
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      catalog:
        sliding-window-type: count-based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  ratelimiter:
    instances:
      placeOrder:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0
  bulkhead:
    instances:
      catalog:
        max-concurrent-calls: 20
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,retryevents
