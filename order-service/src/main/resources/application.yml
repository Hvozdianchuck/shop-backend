spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/orders
    username: shop
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    properties:
      schema.registry.url: http://localhost:8085
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    listener:
      ack-mode: record
      observation-enabled: true
    producer:
      acks: all
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
        # Fail a send within the relay's 10 s wait instead of the default 2 minutes, so a dead broker shows up quickly.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000
  http:
    clients:
      # The schema registry client brings Apache HttpClient, which Boot would pick by default.
      # It retries 503 on its own, under the Resilience4j retry, so the catalog would get twice the attempts.
      imperative:
        factory: jdk
      connect-timeout: 1s
      read-timeout: 2s

server:
  port: 8081

shop:
  avro:
    trusted-packages: com.shop.contracts

catalog:
  base-url: http://localhost:8082

resilience4j:
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      catalog:
        sliding-window-type: count-based
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  ratelimiter:
    instances:
      placeOrder:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0
  bulkhead:
    instances:
      catalog:
        max-concurrent-calls: 20
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,circuitbreakers,circuitbreakerevents,retryevents
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus; Jaeger only takes traces.
        enabled: false
