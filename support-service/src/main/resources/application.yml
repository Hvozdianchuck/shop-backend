spring:
  application:
    name: support-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/support
    username: shop
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    open-in-view: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        temperature: 0.0
        num-ctx: 8192
        # Thinking makes qwen3 several times slower on a CPU; the eval decides whether we need it.
        think: false
        keep-alive: 2h
      embedding:
        model: bge-m3
        keep-alive: 2h
    retry:
      # Network errors and 5xx from Ollama; a reply that does not parse is retried separately, once.
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
    vectorstore:
      pgvector:
        table-name: policy_chunks
        # The table comes from a Flyway migration, with extra columns for full-text search.
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine-distance
        dimensions: 1024
  http:
    clients:
      # Used by the Ollama client. A local model on a CPU can take more than a minute to answer.
      connect-timeout: 2s
      read-timeout: 120s

server:
  port: 8083
  shutdown: graceful

shop:
  triage:
    prompt-version: v3
  tickets:
    lease: 5m
    max-attempts: 3
    retry-delay: 1m

order-service:
  base-url: http://localhost:8081
  connect-timeout: 1s
  read-timeout: 2s

resilience4j:
  retry:
    instances:
      orders:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      model:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        # The worker makes no calls while the circuit is open, so nothing would ever move it to half-open.
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 1
      orders:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
