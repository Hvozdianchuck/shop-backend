spring:
  application:
    name: product-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/products
    username: shop
    password: ${POSTGRES_PASSWORD:shop}
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        # Lets the outbox relay finish the batch it is sending.
        await-termination: true
        await-termination-period: 20s
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    properties:
      schema.registry.url: http://localhost:8085
    consumer:
      group-id: product-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    listener:
      ack-mode: record
      observation-enabled: true
    producer:
      acks: all
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
        # Fail a send within the relay's 10 s wait instead of the default 2 minutes, so a dead broker shows up quickly.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000

server:
  port: 8082
  shutdown: graceful

shop:
  avro:
    trusted-packages: com.shop.contracts

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Restarting the pod does not fix a database outage, so the database only affects readiness.
        # Kafka is left out on purpose: orders are accepted without it and wait in the outbox.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus; Jaeger only takes traces.
        enabled: false
